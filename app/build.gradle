plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.estudoemonitoramentodesensores'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.estudoemonitoramentodesensores"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions{
            annotationProcessorOptions{
                arguments +=["room.schemaLocation":"$projectDir/schemas.toString()"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {

        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.recyclerview

    //  coreLibraryDesugaring libs.desugar.jdk.libs
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    // Local unit tests (src/test) — JVM only, no device needed
    // Used by: SensorTest
    testImplementation libs.junit

    // Instrumented tests (src/androidTest) — requires device or emulator
    // Used by: SensoresDatabaseTest
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.androidx.test.core      // ← ADD: ApplicationProvider
    androidTestImplementation libs.androidx.room.testing   // ← ADD: Room in-memory DB builder
}